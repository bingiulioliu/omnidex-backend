<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#3a3320"/>
      <stop offset="100%" stop-color="#16130b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe898"/>
      <stop offset="100%" stop-color="#c9962e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <circle cx="150" cy="140" r="84" fill="none" stroke="#ffffff14" stroke-width="2"/>
  <g fill="url(#gold)" stroke="#9c7420" stroke-width="3" filter="url(#glow)">
    <polygon points="150,52 190,118 110,118"/>
    <polygon points="96,132 136,198 56,198"/>
    <polygon points="204,132 244,198 164,198"/>
  </g>
  <polygon points="150,52 190,118 110,118" fill="none" stroke="#fff4c2" stroke-width="2" opacity=".6"/>
  <text x="150" y="282" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#ffffff7a">Triforza</text>
</svg>
