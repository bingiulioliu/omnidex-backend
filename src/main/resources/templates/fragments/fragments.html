<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<header>
        <!-- FRAGMENT NAVBAR -->
    <nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Omnidex backoffice</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'home' ? 'active' : ''}"
                            th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'relics' ? 'active' : ''}"
                            th:href="@{/relics}">Reliquie</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'universes' ? 'active' : ''}"
                            th:href="@{/universes}">Universi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'categories' ? 'active' : ''}"
                            th:href="@{/categories}">Categorie</a>
                    </li>
                </ul>
            </div>
            <!-- MOSTRA IL FORM PER NON LOGGATI -->
            <form sec:authorize="isAnonymous()" th:action="@{/login}" method="post" class="d-flex gap-2 ms-auto">
                <input type="text" name="username" class="form-control form-control-sm" placeholder="Username"
                    required />
                <input type="password" name="password" class="form-control form-control-sm" placeholder="Password"
                    required />
                <button type="submit" class="btn btn-sm btn-outline-success">Login</button>
            </form>

            <!-- MOSTRA IL TASTO LOGOUT SE L'UTENTE È LOGGATO -->
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="ms-auto">
                <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
            </form>
        </div>
    </nav>
</header>

<body>

        <!-- FRAGMENT ELENCO -->
    <div th:fragment="cardList(items)" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="item : ${items}">
            <div class="card h-100 shadow-sm">
                <!-- Immagine presente solo per relics -->
                <img th:if="${showImage}"
                    th:src="${item.imgUrl}" 
                    class="card-img-top" 
                    th:alt="${item.imgUrl}"
                    style="height: 200px; object-fit: cover;">

                <div class="card-body d-flex flex-column">
                    <!-- Nome item -->
                    <h5 class="card-title fw-bold" th:text="${item.name}">Nome</h5>
                    <!-- Descrizione item -->
                    <p class="card-text text-muted flex-grow-1" th:text="${item.description}">Descrizione item</p>

                    <!-- Bottoni azione -->
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div class="btn-group btn-group-sm ms-auto" role="group">
                            <a th:href="@{/{items}/{id}(id=${item.id})}" class="btn btn-outline-primary btn-sm">Dettagli</a>
                            <a th:href="@{/{items}/create-or-edit/{id}(id=${item.id})}"
                                class="btn btn-outline-secondary btn-sm">Modifica</a>
                            <form th:action="@{/{items}/delete/{id}(id=${item.id})}" method="post" class="d-inline"
                                th:onsubmit="return confirm('Sei sicuro di voler procedere con la eliminazione');">
                                <button type="submit" class="btn btn-sm btn-danger">Elimina</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
