<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<header>
        <!-- FRAGMENT NAVBAR -->
    <nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Omnidex backoffice</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'home' ? 'active' : ''}"
                            th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'relics' ? 'active' : ''}"
                            th:href="@{/relics}">Reliquie</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'universes' ? 'active' : ''}"
                            th:href="@{/universes}">Universi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'categories' ? 'active' : ''}"
                            th:href="@{/categories}">Categorie</a>
                    </li>
                </ul>
            </div>
            <!-- MOSTRA IL FORM PER NON LOGGATI -->
            <form sec:authorize="isAnonymous()" th:action="@{/login}" method="post" class="d-flex gap-2 ms-auto">
                <input type="text" name="username" class="form-control form-control-sm" placeholder="Username"
                    required />
                <input type="password" name="password" class="form-control form-control-sm" placeholder="Password"
                    required />
                <button type="submit" class="btn btn-sm btn-outline-success">Login</button>
            </form>

            <!-- MOSTRA IL TASTO LOGOUT SE L'UTENTE È LOGGATO -->
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="ms-auto">
                <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
            </form>
        </div>
    </nav>
</header>

<body>

    <!-- FRAGMENT ELENCO -->
    <div th:fragment="cardList(items, baseUrl, showImage)" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="item : ${items}">
            <div class="card h-100 shadow-sm">
                <!-- Immagine presente solo se showImage = true -->
                <img th:if="${showImage}"
                    th:src="${item.imgUrl}" 
                    class="card-img-top" 
                    th:alt="${item.imgUrl}"
                    style="height: 200px; object-fit: cover;">

                <div class="card-body d-flex flex-column">
                    <!-- Nome item -->
                    <h5 class="card-title fw-bold" th:text="${item.name}">Nome</h5>
                    <!-- Descrizione item -->
                    <p class="card-text text-muted flex-grow-1" th:text="${item.description}">Descrizione item</p>

                    <!-- Bottoni azione -->
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <div class="btn-group btn-group-sm ms-auto" role="group">
                            <a th:href="@{${baseUrl} + '/' + ${item.id}}" class="btn btn-outline-primary btn-sm">Dettagli</a>
                            <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{${baseUrl} + '/' + 'edit' + '/' + ${item.id}}"
                                class="btn btn-outline-secondary btn-sm">Modifica</a>
                            <form sec:authorize="hasRole('ROLE_ADMIN')" th:action="@{${baseUrl} + '/' + 'delete' + '/' + ${item.id}}" method="post" class="d-inline"
                                th:onsubmit="return confirm('Sei sicuro di voler procedere con la eliminazione');">
                                <button type="submit" class="btn btn-sm btn-danger">Elimina</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FRAGMENT DETTAGLIO -->
    <div th:fragment="detail(item, baseUrl, showInfo)" class="card shadow-lg mx-3 my-4">
        <div class="row g-0">
            <!-- Colonna immagine mostrata solo se showImage=true (in relicDetails) -->
            <div th:if="${showInfo != null and showInfo}" class="col-12 col-md-6 d-flex align-items-center justify-content-center">
                <img th:if="${showInfo}"
                th:src="${item.imgUrl}" 
                class="img-fluid rounded-start w-100" 
                th:alt="${item.name}"
                style="object-fit: cover; min-height: 300px;">
            </div>
            <!-- Colonna contenuto -->
            <!-- Se showImage=true col-md-6 -->
            <!-- Se showImage=false col-md-12 -->
            <div class="col-12"
                th:classappend="${showInfo != null and showInfo ? 'col-md-6' : ''}">
                <div class="card-body p-4">
                    <a th:href="@{${baseUrl}}" class="btn btn-secondary mb-3">← Torna indietro</a>
                    <h2 class="card-title fw-bold mb-3" th:text="${item.name}">Nome item</h2>
                    <p class="card-text fs-5 text-secondary mb-4" th:text="${item.description}">Descrizione item
                    </p>
                    
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a th:href="@{${baseUrl} + '/' + 'edit/' + ${item.id}}"
                            class="btn btn-outline-secondary btn-sm">Modifica</a>
                        <form th:action="@{${baseUrl} + '/' + '/delete/' + ${item.id}}" method="post" class="d-inline"
                            th:onsubmit="return confirm('Sei sicuro di voler procedere con la eliminazione');">
                            <button type="submit" class="btn btn-sm btn-danger">Elimina</button>
                        </form>
                    </div>

                    <!-- Lista categorie (solo per relics) -->
                    <div th:if="${showInfo}"
                        class="mt-4 pt-3 border-top">
                        <h5 class="fw-bold mb-3">Categorie associate</h5>
                        <div th:if="${#lists.isEmpty(relic.getCategories())}" class="text-muted small">
                            Non ci sono offerte attive
                        </div>
                        <div th:unless="${#lists.isEmpty(relic.getCategories())}"
                            class="d-flex justify-content-between align-items-center mt-3"
                            th:each="category : ${relic.getCategories()}">
                            <span class="btn btn-outline-success" th:text="${category.name}"></span>
                        </div>
                    </div>
                    <!-- Universo di appartenenza (solo per relics) -->
                    <div th:if="${showInfo}"
                        class="mt-4 pt-3 border-top">
                        <h5 class="fw-bold mb-3">Universo di appartenenza</h5>
                        <div th:if="${relic.getUniverse() != null}" class="text-muted small">
                            Non è ancora stato associato un universo
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3"
                            th:text="${relic.getUniverse()}">
                            <span class="btn btn-outline-success" th:text="${universe.name}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
