<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${edit} ? 'Modifica reliquia' : 'Crea reliquia'">Gestione reliquia - Omnidex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- Fragment della navbar -->
<header>
    <div th:replace="~{fragments/fragments :: navbar(relics)}"></div>
</header>

<!-- Contenuto form create/edit -->

<body>

    <!-- Form Create/edit -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">
                            <span th:text="${edit} ? '✏️ Modifica ' : '🏷️ Aggiungi '">Reliquia</span>
                        </h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- Form unico per Create e Edit -->
                        <form th:action="${edit} ? @{/relics/edit/{id}(id=${relic.id})} : @{/relics/create}"
                            th:object="${relic}" method="POST">

                            <!-- Campo Nascosto ID (necessario solo per Edit) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Titolo -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Nome reliquia</label>
                                <input type="text" id="name" class="form-control" th:field="*{name}"
                                    th:errorclass="is-invalid" placeholder="Nome reliquia">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Errore nome
                                </div>
                            </div>

                            <!-- 2. DESCRIZIONE -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Descrizione</label>
                                <textarea id="description" class="form-control" rows="4" th:field="*{description}"
                                    th:errorclass="is-invalid" placeholder="Inserisci la descrizione..."></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                                    th:errors="*{description}">
                                    Errore descrizione
                                </div>
                            </div>

                            <!-- URL IMMAGINE -->
                            <div class="mb-3">
                                <label for="imgUrl" class="form-label fw-bold">URL Immagine</label>
                                <input type="text" id="imgUrl" class="form-control" th:field="*{imgUrl}"
                                    th:errorclass="is-invalid" placeholder="https://esempio.com/immagine.jpg">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('imgUrl')}"
                                    th:errors="*{imgUrl}">
                                    Errore URL immagine
                                </div>
                            </div>

                            <!-- SELECT UNIVERSO  -->
                            <div class="mb-4">
                                <label for="universe" class="form-label fw-bold">Universo</label>
                                <select id="universe" class="form-select" th:field="*{universe}"
                                    th:errorclass="is-invalid">
                                    <option value="">-- Seleziona Universo --</option>
                                    <option th:each="u : ${universes}" th:value="${u.id}" th:text="${u.name}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('universe')}"
                                    th:errors="*{universe}">
                                    Errore selezione universo
                                </div>
                            </div>

                            <!-- SELECT CATEGORIE  -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Categorie</label>
                                <div th:each="category : ${categories}" class="form-check">
                                    <input type="checkbox" class="form-check-input" th:field="*{categories}"
                                        th:value="${category.id}" th:id="'category' + ${category.id}">
                                    <label class="form-check-label" th:for="'category' + ${category.id}"
                                        th:text="${category.name}"></label>
                                </div>
                            </div>

                            <!-- Pulsanti di Azione -->
                            <div class="d-flex justify-content-between">

                                <!-- Annulla: se edit torna al dettaglio, altrimenti torna all'indice -->
                                <a th:href="${edit} ? @{/relics/{id}(id=*{id})} : @{/relics}"
                                    class="btn btn-secondary">Annulla</a>

                                <button type="submit" class="btn"
                                    th:classappend="${edit} ? 'btn-warning' : 'btn-success'"
                                    th:text="${edit} ? 'Salva Modifiche' : 'Aggiungi reliquia'">
                                    Salva
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
