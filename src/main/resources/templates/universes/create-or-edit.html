<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${edit} ? 'Modifica universo' : 'Aggiungi universo'">Gestione universo - Omnidex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- Fragment della navbar -->
<header>
    <div th:replace="~{fragments/fragments :: navbar(universes)}"></div>
</header>

<!-- Contenuto form create/edit -->

<body>

    <!-- Form Create/edit -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">
                            <span th:text="${edit} ? '✏️ Modifica ' : '🏷️ Aggiungi '">Universo</span>
                        </h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- Form unico per Create e Edit -->
                        <form th:action="${edit} ? @{/universes/edit/{id}(id=${universe.id})} : @{/universes/create}"
                            th:object="${universe}" method="POST">

                            <!-- Campo Nascosto ID (necessario solo per Edit) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Titolo -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Nome Universo</label>
                                <input type="text" id="name" class="form-control" th:field="*{name}"
                                    th:errorclass="is-invalid" placeholder="Nome universo">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Errore nome
                                </div>
                            </div>

                            <!-- 2. DESCRIZIONE -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Descrizione</label>
                                <textarea id="description" class="form-control" rows="4" th:field="*{description}"
                                    th:errorclass="is-invalid" placeholder="Inserisci la descrizione..."></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                                    th:errors="*{description}">
                                    Errore descrizione
                                </div>
                            </div>

                            <!-- Pulsanti di Azione -->
                            <div class="d-flex justify-content-between">

                                <!-- Annulla: se edit torna al dettaglio, altrimenti torna all'indice -->
                                <a th:href="${edit} ? @{/universes/{id}(id=*{id})} : @{/universes}"
                                    class="btn btn-secondary">Annulla</a>

                                <button type="submit" class="btn"
                                    th:classappend="${edit} ? 'btn-warning' : 'btn-success'"
                                    th:text="${edit} ? 'Salva Modifiche' : 'Crea Universo'">
                                    Salva
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
